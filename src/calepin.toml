  target = "grammar/intro.typ"

  [[sidebar.section.item]]
  target = "grammar/phonology.typ"

  [[sidebar.section.item]]
  target = "grammar/nouns.typ"

  [[sidebar.section.item]]
  target = "grammar/verbs.typ"

  [[sidebar.section.item]]
  target = "grammar/syntax.typ"

